run_type = "staged_learning"
device = "cuda:0"                          # RL with docking is GPU territory
tb_logdir = "tb_rl"

[parameters]
summary_csv_prefix = "/workspace/results/rl"
use_checkpoint = false
prior_file = "/workspace/configs/priors/mol2mol_medium_similarity.prior"   # ANCHOR — original prior, the leash
agent_file = "/workspace/models/1/tl_mol2mol.model"                    # your FIRST (diverse) TL model
smiles_file = "/workspace/configs/references.smi"                  # SEEDS — your 16 references
batch_size = 32
randomize_smiles = false                                # mol2mol prior wasn't trained randomized

[learning_strategy]
type = "dap"                               # DAP is the recommended strategy
sigma = 128
rate = 0.0001

[diversity_filter]                         # THE anti-collapse mechanism — non-negotiable for you
type = "IdenticalMurckoScaffold"
bucket_size = 25                           # cap molecules per scaffold before score is penalized
minscore = 0.4

[[stage]]
chkpt_file = "/workspace/models/rl_stage1.chkpt"
termination = "simple"
max_steps = 100                            # start small; docking is the bottleneck
max_score = 0.7

[stage.scoring]
type = "geometric_mean"                    # all components must be decent — no gaming one

# ---- Docking via DockStream (the objective) ----------------------------------
[[stage.scoring.component]]
[stage.scoring.component.DockStream]
[[stage.scoring.component.DockStream.endpoint]]
name   = "docking"
weight = 1.0 #start at weight 1 and only raise it if you see docking scores plateauing while the guard scores sit high
params.configuration_path = "/workspace/configs/dockstream_config.json"
params.docker_script_path = "/opt/DockStream/docker.py"
params.docker_python_path = "/opt/conda/envs/DockStream/bin/python"
transform.type = "reverse_sigmoid"
transform.low  = -12.0
transform.high = -7.0
transform.k    = 0.5

[[stage.scoring.component]]
[[stage.scoring.component.QED.endpoint]]   # the drug-likeness counterweight to docking's size/lipophilia bias
name = "QED"
weight = 1
transform.type = "right_step"
transform.low = 0.5

# ---- MolecularWeight: the ceiling that stops docking-size-gaming --------------
[[stage.scoring.component]]
[stage.scoring.component.MolecularWeight]
[[stage.scoring.component.MolecularWeight.endpoint]]
name   = "MW"
weight = 0.5
transform.type = "double_sigmoid"
transform.low  = 150.0
transform.high = 500.0
transform.coef_div = 500.0
transform.coef_si  = 20.0
transform.coef_se  = 20.0

# ---- Halogens: keep the preference alive --------------------------------------
[[stage.scoring.component]]
[stage.scoring.component.GroupCount]
[[stage.scoring.component.GroupCount.endpoint]]
name   = "Halogens"
weight = 0.3
params.smarts  = "[F,Cl,Br,I]"
transform.type = "sigmoid"
transform.low  = 0.0
transform.high = 2.0
transform.k    = 0.5
