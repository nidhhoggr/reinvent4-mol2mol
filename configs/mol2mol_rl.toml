run_type = "staged_learning"
device = "cpu"
#device = "cuda:0"                          # switch to GPU if available (Vina docking stays CPU-bound either way)
tb_logdir = "results/tb_rl"                 # under results/ so dump_tb finds it and the backup syncs it

[parameters]
summary_csv_prefix = "/workspace/results/rl"
prior_file = "/workspace/configs/priors/mol2mol_medium_similarity.prior"   # ANCHOR — the prior, the leash
agent_file = "/workspace/models/1/tl_mol2mol.model"                        # the diverse TL model to optimize
smiles_file = "/workspace/configs/references.smi"                          # SEEDS — your references
batch_size = 18
randomize_smiles = false                    # mol2mol prior wasn't trained randomized

[learning_strategy]
type = "dap"
sigma = 128
rate = 0.0001

[diversity_filter]                          # anti-collapse: cap molecules per Murcko scaffold
type = "IdenticalMurckoScaffold"
bucket_size = 25
minscore = 0.4

[[stage]]
chkpt_file = "/workspace/results/mol2mol.chkpt"   # end-of-run checkpoint (also written on SIGUSR1)
termination = "plateau"                      # stops when the score curve flattens (low slope over its memory window) after min_steps
min_steps = 50
max_steps = 100                             # hard cap / total RL steps (raise for a longer campaign)
# max_score is unused by plateau — drop it or leave it; it has no effect here

[stage.scoring]
type = "geometric_mean"                    # all components must be decent — no gaming one. Every component is a near-gate; a single ~0 tanks the product (intended for AromRings 4+/MW). Keep transforms smooth so the agent still gets a gradient out of bad regions.

# ---- Docking via DockStream (the objective) ----------------------------------
[[stage.scoring.component]]
[stage.scoring.component.DockStream]
[[stage.scoring.component.DockStream.endpoint]]
name   = "docking"
weight = 1.0 #start at weight 1 and only raise it if docking plateaus while the guard scores sit high — last run docking ALREADY plateaued (~-10.1) while guards drifted, so the fix is stronger guards, not more docking
params.configuration_path = "/workspace/configs/dockstream_config.json"
params.docker_script_path = "/opt/DockStream/docker.py"
params.docker_python_path = "/opt/conda/envs/DockStream/bin/python"
transform.type = "reverse_sigmoid"
transform.low  = -12.0
transform.high = -7.0
transform.k    = 0.5

# ---- QED — FIXED: was right_step (read `high`, defaulted to 0.0 = no-op) ----
# sigmoid gives a real gradient; raw QED 0.39 now scores ~0.15, 0.6 ~0.8.
[[stage.scoring.component]]
[stage.scoring.component.QED]
[[stage.scoring.component.QED.endpoint]]
name   = "QED"
weight = 1.5                          # bumped from 1 so it actually pushes back
transform.type = "sigmoid"
transform.low  = 0.35
transform.high = 0.70
transform.k    = 0.5

# ---- SAScore — synthesizability (raw 1=easy .. 10=hard; reward low) --------
# guards the prior drift (last run prior-NLL hit ~43, ~31 nats off the manifold)
[[stage.scoring.component]]
[stage.scoring.component.SAScore]
[[stage.scoring.component.SAScore.endpoint]]
name   = "SAScore"
weight = 0.5
transform.type = "reverse_sigmoid"
transform.low  = 2.0      # SA 2 -> ~1.0
transform.high = 5.0      # SA 4 -> ~0.27, SA 5 -> ~0.05; loosen high if CF3/halogens push SA up
transform.k    = 0.5

# ---- MolecularWeight — tightened so the ceiling bites before ~440 ----------
[[stage.scoring.component]]
[stage.scoring.component.MolecularWeight]
[[stage.scoring.component.MolecularWeight.endpoint]]
name   = "MW"
weight = 0.5
transform.type = "double_sigmoid"
transform.low  = 150.0
transform.high = 440.0                # was 500; 420 Da was still scoring ~0.93
transform.coef_div = 440.0
transform.coef_si  = 20.0
transform.coef_se  = 30.0             # steeper right shoulder

# ---- NumAromaticRings — allow up to 3 (the reference ceiling), penalize 4+ ---
# Refs top out at 3 aromatic rings (10/17 have exactly 3, none reach 4), so the
# old low=1/high=4 was punishing the desired chemotype. reverse_sigmoid low=3
# high=5: <=3 -> ~1.0, 4 -> ~0.5 (soft), 5+ -> ~0 (gated). Ring-count quality
# above 3 is the only thing this guards; QED/SA/MW handle the rest.
[[stage.scoring.component]]
[stage.scoring.component.NumAromaticRings]
[[stage.scoring.component.NumAromaticRings.endpoint]]
name   = "AromRings"
weight = 0.6
transform.type = "reverse_sigmoid"
transform.low  = 3.0
transform.high = 5.0
transform.k    = 0.5

# ---- Halogens: keep the preference alive --------------------------------------
[[stage.scoring.component]]
[stage.scoring.component.GroupCount]
[[stage.scoring.component.GroupCount.endpoint]]
name   = "Halogens"
weight = 0.3
params.smarts  = "[F,Cl,Br,I]"
transform.type = "sigmoid"
transform.low  = 0.0
transform.high = 2.0
transform.k    = 0.5

# ---- OPTIONAL: Fsp3 floor — gentle 3D nudge, overlaps with AromRings -------
# NOT covered by QED (QED has no sp3 term). Redundant with AromRings, not QED.
# Add only if AromRings alone doesn't restore 3D character; low weight so you
# don't double-gate. Fsp3 0.42 -> ~0.9, 0.25 -> ~0.1.
