run_type = "staged_learning"
device = "cpu"
#device = "cuda:0"                          # RL with docking is GPU territory
tb_logdir = "tb_rl"                        # static unless you add the tb rule to make_template.py (per-chunk dirs avoid sawtooth — see below)

[parameters]
summary_csv_prefix = "/workspace/results/rl"   # make_template -> __CSVPREFIX__ (per-chunk, so REINVENT's "w+" never clobbers history)
# NOTE: do NOT add a use_checkpoint line here. make_template.py INJECTS
# `use_checkpoint = __USE__` right after agent_file; a second one = TOML duplicate-key error.
purge_memories = false                      # CRITICAL: default is true, which purges the Murcko buckets BEFORE the checkpoint save = resets anti-collapse every chunk. make_template leaves this untouched, so it MUST live here. Off = buckets persist across chunks.
prior_file = "/workspace/configs/priors/mol2mol_medium_similarity.prior"   # ANCHOR — original prior, the leash (CONSTANT, never the checkpoint)
agent_file = "/workspace/models/1/tl_mol2mol.model"   # make_template -> __AGENT__ (chunk 0 = this TL model; every resume = the live checkpoint)
smiles_file = "/workspace/configs/references.smi"                  # SEEDS — your 16 references
batch_size = 36
randomize_smiles = false                                # mol2mol prior wasn't trained randomized

[learning_strategy]
type = "dap"                               # DAP is the recommended strategy
sigma = 128
rate = 0.0001

# On every resume the DF is loaded FROM the checkpoint, so this block is ignored
# while use_checkpoint = true (the checkpoint branch wins). Set bucket_size /
# minscore the way you want them BEFORE chunk 0 — you can't change them mid-run
# without starting fresh. Scoring components below DO hot-reload each chunk.
[diversity_filter]                         # THE anti-collapse mechanism — non-negotiable for you
type = "IdenticalMurckoScaffold"
bucket_size = 25                           # cap molecules per scaffold before score is penalized
minscore = 0.4

[[stage]]
chkpt_file = "/workspace/results/mol2mol.chkpt"   # make_template FORCES this to its ROLLING_CHKPT constant — keep the line, but the value here is cosmetic. Must match $CHKPT in run_resilient.sh.
termination = "simple"                      # CHUNKED PATH: make_template forces max_score->1.0, so "simple" never fires and each chunk runs its full __MAXSTEPS__. (Switch to "plateau" only for a single non-chunked run.)
min_steps = 50                             # make_template FORCES this to 0 for the template; value here only matters for a standalone non-chunked run
max_steps = 100                            # make_template -> __MAXSTEPS__ (= CHUNK_STEPS per chunk); standalone runs use this value
max_score = 0.65                           # make_template FORCES this to 1.0 for the template; value here only matters standalone

[stage.scoring]
type = "geometric_mean"                    # all components must be decent — no gaming one. Every component is now a near-gate; a single ~0 tanks the product (intended for AromRings 4+/MW). Keep transforms smooth so the agent still gets a gradient out of bad regions.

# ---- Docking via DockStream (the objective) ----------------------------------
[[stage.scoring.component]]
[stage.scoring.component.DockStream]
[[stage.scoring.component.DockStream.endpoint]]
name   = "docking"
weight = 1.0 #start at weight 1 and only raise it if docking plateaus while the guard scores sit high — last run docking ALREADY plateaued (~-10.1) while guards drifted, so the fix is stronger guards, not more docking
params.configuration_path = "/workspace/configs/dockstream_config.json"
params.docker_script_path = "/opt/DockStream/docker.py"
params.docker_python_path = "/opt/conda/envs/DockStream/bin/python"
transform.type = "reverse_sigmoid"
transform.low  = -12.0
transform.high = -7.0
transform.k    = 0.5

# ---- QED — FIXED: was right_step (read `high`, defaulted to 0.0 = no-op) ----
# sigmoid gives a real gradient; raw QED 0.39 now scores ~0.15, 0.6 ~0.8.
[[stage.scoring.component]]
[stage.scoring.component.QED]
[[stage.scoring.component.QED.endpoint]]
name   = "QED"
weight = 1.5                          # bumped from 1 so it actually pushes back
transform.type = "sigmoid"
transform.low  = 0.35
transform.high = 0.70
transform.k    = 0.5

# ---- SAScore — synthesizability (raw 1=easy .. 10=hard; reward low) --------
# guards the prior drift (last run prior-NLL hit ~43, ~31 nats off the manifold)
[[stage.scoring.component]]
[stage.scoring.component.SAScore]
[[stage.scoring.component.SAScore.endpoint]]
name   = "SAScore"
weight = 0.5
transform.type = "reverse_sigmoid"
transform.low  = 2.0      # SA 2 -> ~1.0
transform.high = 5.0      # SA 4 -> ~0.27, SA 5 -> ~0.05; loosen high if CF3/halogens push SA up
transform.k    = 0.5

# ---- MolecularWeight — tightened so the ceiling bites before ~440 ----------
[[stage.scoring.component]]
[stage.scoring.component.MolecularWeight]
[[stage.scoring.component.MolecularWeight.endpoint]]
name   = "MW"
weight = 0.5
transform.type = "double_sigmoid"
transform.low  = 150.0
transform.high = 440.0                # was 500; 420 Da was still scoring ~0.93
transform.coef_div = 440.0
transform.coef_si  = 20.0
transform.coef_se  = 30.0             # steeper right shoulder

# ---- NumAromaticRings — allow up to 3 (the reference ceiling), penalize 4+ ---
# Refs top out at 3 aromatic rings (10/17 have exactly 3, none reach 4), so the
# old low=1/high=4 was punishing the desired chemotype. reverse_sigmoid low=3
# high=5: <=3 -> ~1.0, 4 -> ~0.5 (soft), 5+ -> ~0 (gated). Ring-count quality
# above 3 is the only thing this guards; QED/SA/MW handle the rest.
[[stage.scoring.component]]
[stage.scoring.component.NumAromaticRings]
[[stage.scoring.component.NumAromaticRings.endpoint]]
name   = "AromRings"
weight = 0.6
transform.type = "reverse_sigmoid"
transform.low  = 3.0
transform.high = 5.0
transform.k    = 0.5


# ---- Halogens: keep the preference alive --------------------------------------
[[stage.scoring.component]]
[stage.scoring.component.GroupCount]
[[stage.scoring.component.GroupCount.endpoint]]
name   = "Halogens"
weight = 0.3
params.smarts  = "[F,Cl,Br,I]"
transform.type = "sigmoid"
transform.low  = 0.0
transform.high = 2.0
transform.k    = 0.5


# ---- OPTIONAL: Fsp3 floor — gentle 3D nudge, overlaps with AromRings -------
# NOT covered by QED (QED has no sp3 term). Redundant with AromRings, not QED.
# Add only if AromRings alone doesn't restore 3D character; low weight so you
# don't double-gate. Fsp3 0.42 -> ~0.9, 0.25 -> ~0.1.
