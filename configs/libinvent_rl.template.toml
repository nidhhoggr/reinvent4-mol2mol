# =============================================================================
# REINVENT4 — LibInvent reinforcement learning (scaffold decoration / R-groups)
# Run with:  reinvent libinvent_rl.toml
# =============================================================================

run_type = "staged_learning"
device   = "cpu"          # "cuda:0" or "cpu"
tb_logdir = "tb_libinvent"   # TensorBoard logs

[parameters]
# --- LibInvent prior + starting agent (same file unless you ran TL first) ---
prior_file = "/workspace/configs/priors/libinvent.prior"
agent_file = "__AGENT__"
use_checkpoint = __USE__

# --- LibInvent is a CONDITIONAL generator: scaffolds come from a .smi file ---
smiles_file = "/workspace/configs/scaffolds.smi"

summary_csv_prefix = "__CSVPREFIX__"
#make this higher on faster machines
batch_size         = 32
randomize_smiles   = true
temperature        = 0.75      # your original sampling temperature; valid in 4.8.x
# NOTE: `unique_sequences` does NOT exist in REINVENT 4.8.x — do not add it.

[learning_strategy]
type  = "dap"     # always "dap"
sigma = 128       # reward scaling (lower = more conservative)
rate  = 0.0001    # Adam learning rate (your old "learning_rate")

[diversity_filter]
type        = "IdenticalMurckoScaffold"
bucket_size = 25
minscore    = 0.4

# =============================================================================
# Single stage faithful to your original 3 objectives.
# NOTE: docking every molecule from step 1 is expensive — see the curriculum
# (two-stage) variant at the bottom of this file, which is the recommended
# pattern when one component is costly.
# =============================================================================
[[stage]]
chkpt_file  = "/workspace/results/libinvent.chkpt"
termination = "simple"
max_score   = 1.0
min_steps   = 0
max_steps   = __MAXSTEPS__

[stage.scoring]
type = "geometric_mean"   # a single 0 pulls the total to 0 — keep objectives few

# ---- Docking via DockStream (weight 1.0) ------------------------------------
# DockStream needs THREE paths, not one. configuration_path is your old
# docking_config_path; the other two point at the DockStream install.
# Docking scores are negative & lower-is-better -> reverse_sigmoid transform.
[[stage.scoring.component]]
[stage.scoring.component.DockStream]
[[stage.scoring.component.DockStream.endpoint]]
name   = "docking"
weight = 1.0
params.configuration_path = "/workspace/configs/dockstream_config.json"
params.docker_script_path = "/opt/DockStream/docker.py"
params.docker_python_path = "/opt/conda/envs/DockStream/bin/python"
transform.type = "reverse_sigmoid"
transform.low  = -12.0    # very good score -> ~1.0  (tune to your target)
transform.high = -6.0     # weak score      -> ~0.0
transform.k    = 0.5

# ---- QED (weight 0.1) -------------------------------------------------------
# QED is already 0–1, so no transform is strictly required.
[[stage.scoring.component]]
[stage.scoring.component.QED]
[[stage.scoring.component.QED.endpoint]]
name   = "QED"
weight = 0.3

# ---- Synthesizability = SAScore (weight 0.05) -------------------------------
# SAScore is 1 (easy) .. 10 (hard) -> reverse_sigmoid so lower scores win.
[[stage.scoring.component]]
[stage.scoring.component.SAScore]
[[stage.scoring.component.SAScore.endpoint]]
name   = "SAScore"
weight = 0.05
transform.type = "reverse_sigmoid"
transform.low  = 2.0
transform.high = 6.0
transform.k    = 0.5

#
# Molecular Weight
#
# Vina scores improve with sheer molecular size (more atoms → more contacts), so with docking at weight 1.0 and QED at only 0.1, the agent's path of least resistance is to bloat molecules to game the docking score, and your weak QED term won't stop it. Over a few hundred steps this usually produces undruggable blobs.
#
# Add an explicit molecular-weight ceiling and give QED a bit more say. Drop this into libinvent_rl.toml alongside your other components, and bump the QED weight from 0.1 to ~0.3
#
[[stage.scoring.component]]
[stage.scoring.component.MolecularWeight]
[[stage.scoring.component.MolecularWeight.endpoint]]
name   = "MW"
weight = 0.5
transform.type = "double_sigmoid"
transform.low  = 150.0
transform.high = 500.0
transform.coef_div = 500.0
transform.coef_si  = 20.0
transform.coef_se  = 20.0



# One tuning thought. Your low=2, high=4 still gives a biphenyl (2 aromatic rings) a near-full score and only bites at 3–4. 
# Since phenyl substitution is already dominating, you may want it to bite sooner — low=1, high=3 penalizes
# the second aromatic ring and crushes the third, which is a stronger anti-phenyl push. 
[[stage.scoring.component]]
[stage.scoring.component.NumAromaticRings]
[[stage.scoring.component.NumAromaticRings.endpoint]]
name   = "AromaticRings"
weight = 1.0
transform.type = "reverse_sigmoid"
transform.low  = 0.0
transform.high = 1.0
transform.k    = 0.5

# Try this is the bove rule doesn't work.
#
#[[stage.scoring.component]]
#[stage.scoring.component.CustomAlerts]
#[[stage.scoring.component.CustomAlerts.endpoint]]
#name = "no_benzene"
#params.smarts = ["c1ccccc1"]

# Attempt to make molecules bushier instead of long
# Confirmed what it is before tuning: in REINVENT4, GraphLength is the RDKit topological distance — i.e. the graph diameter, the longest through-bond path between any two atoms in the molecule, counted in bonds. That's exactly the right lever for your problem: a hexyl tail or an extended fused-ring chain stretches that longest path, while a compact, branched decoration doesn't. So you want the same transform shape you used for aromatic rings — reverse_sigmoid, since less length is better
[[stage.scoring.component]]
[stage.scoring.component.GraphLength]
[[stage.scoring.component.GraphLength.endpoint]]
name   = "GraphLength"
weight = 1.0
transform.type = "reverse_sigmoid"
transform.low  = 9.0     # ≈ your bare scaffold's diameter
transform.high = 13.0    # a few bonds beyond → crushed
transform.k    = 0.5     # reuse your aromatic-ring intuition, tune empirically


#GraphLength on its own makes molecules small, not bushy. If length is the only pressure on size, the cheapest way to win is to drop the R-groups or shrink them to a single atom — diameter falls, score rises, and you've lost the decoration you wanted. "Bushy" isn't "short," it's "many atoms packed into a small diameter." To actually get branching you have to want size and penalize length simultaneously. Anchor the size with a heavy-atom term (or just your real design objective, if it already requires those R-groups):
[[stage.scoring.component]]
[stage.scoring.component.NumHeavyAtoms]
[[stage.scoring.component.NumHeavyAtoms.endpoint]]
name = "HeavyAtoms"
weight = 1.0
transform.type = "sigmoid"   # more atoms → better, saturating near your target
transform.low  = 22.0
transform.high = 34.0
transform.k    = 0.5



# Reward the use of halogens

[[stage.scoring.component]]
[stage.scoring.component.GroupCount]
[[stage.scoring.component.GroupCount.endpoint]]
name   = "Halogens"
weight = 1.0
params.smarts  = "[F,Cl,Br,I]"
transform.type = "sigmoid"
transform.low  = 0.0
transform.high = 2.0
transform.k    = 0.5

