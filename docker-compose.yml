x-reinvent-base: &reinvent-base
  image: htvs-pipeline:latest
  working_dir: /workspace
  volumes:
    - .:/workspace
  env_file:
    - host.env
  environment:
    PYTHONUNBUFFERED: "1"
  restart: "no"
  stop_grace_period: 180s
  stop_signal: SIGTERM
  logging:
    driver: json-file
    options:
      max-size: "50m"
      max-file: "5"

services:
  builder:
    build:
      context: .
    image: htvs-pipeline:latest
    entrypoint: ["echo", "Schema builder service"]

  tl:
    <<: *reinvent-base
    container_name: reinvent4-tl
    depends_on:
      - builder
    command: ["/opt/conda/envs/reinvent4/bin/reinvent",
              "-l", "logs/tl.log", "configs/mol2mol_tl.toml"]

  sample:
    <<: *reinvent-base
    container_name: reinvent4-sample
    depends_on:
      - builder
    command: ["/opt/conda/envs/reinvent4/bin/reinvent",
              "-l", "logs/sampling.log", "configs/mol2mol_sample.toml"]

  rl:
    <<: *reinvent-base
    container_name: reinvent4-rl
    depends_on:
      - builder
    command: ["/opt/conda/envs/reinvent4/bin/reinvent",
              "-l", "logs/rl.log", "configs/mol2mol_rl.toml"]

  tensorboard:   
    <<: *reinvent-base
    container_name: reinvent-tb
    depends_on:
      - builder
    working_dir: /workspace
    command: ["/opt/conda/envs/reinvent4/bin/tensorboard",
              "--logdir", "${TB_LOGDIR:-/workspace/tb_TL}",
              "--host", "0.0.0.0", "--port", "6006"]
    volumes:
      - ${PWD}:/workspace:ro
    ports:
      - "6006:6006"
    restart: unless-stopped

  tb-dump:
    <<: *reinvent-base
    container_name: reinvent4-tb-dump
    profiles: ["backup"]
    depends_on:
      - builder
    command: ["bash", "/workspace/scripts/dump_tb_loop.sh"]
    environment:
      PYTHONUNBUFFERED: "1"        # re-declared: this block overrides the anchor's
      DUMP_INTERVAL: ${DUMP_INTERVAL:-120}
    restart: unless-stopped
    stop_grace_period: 30s
