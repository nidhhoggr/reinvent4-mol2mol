x-reinvent-base: &reinvent-base
  image: htvs-pipeline:latest
  working_dir: /workspace
  volumes:
    - .:/workspace
  env_file:
    - host.env
  environment:
    PYTHONUNBUFFERED: "1"
  restart: "no"
  stop_grace_period: 180s
  stop_signal: SIGTERM
  logging:
    driver: json-file
    options:
      max-size: "50m"
      max-file: "5"

services:
  builder:
    build:
      context: .
    image: htvs-pipeline:latest
    entrypoint: ["echo", "Schema builder service"]

  tl:
    <<: *reinvent-base
    container_name: reinvent4-tl
    depends_on:
      - builder
    command: ["/opt/conda/envs/reinvent4/bin/reinvent",
              "-l", "logs/tl.log", "configs/tl_mol2mol.toml"]

  sample:
    <<: *reinvent-base
    container_name: reinvent4-sample
    depends_on:
      - builder
    command: ["/opt/conda/envs/reinvent4/bin/reinvent",
              "-l", "logs/sampling.log", "configs/sample_mol2mol.toml"]

  rl:
    <<: *reinvent-base
    container_name: reinvent4-rl
    depends_on:
      - builder
    command: ["/opt/conda/envs/reinvent4/bin/reinvent",
              "-l", "logs/rl.log", "configs/staged_rl_mol2mol.toml"]

  make-template:
    <<: *reinvent-base
    container_name: reinvent4-rl-template-maker
    depends_on:
      - builder
    environment:
      CONFIG_SCRIPT_NAME: ${CONFIG_SCRIPT_NAME:-mol2mol_rl}
    entrypoint: ["bash", "/workspace/scripts/make_template.bash"]
    restart: "no"

  resilient-rl:
    <<: *reinvent-base
    container_name: reinvent4-resilient-rl
    depends_on:
      builder:
        condition: service_started
      make-template:
        condition: service_completed_successfully
    command: ["bash", "/workspace/scripts/run_resilient.sh"]
    restart: unless-stopped
    environment:
      PYTHONUNBUFFERED: "1"            # must re-declare; this block overrides the anchor's environment
      TARGET_STEPS: ${TARGET_STEPS:-500}
      CHUNK_STEPS: ${CHUNK_STEPS:-10}

  tensorboard:   
    <<: *reinvent-base
    container_name: reinvent-tb
    depends_on:
      - builder
    working_dir: /workspace
    command: ["/opt/conda/envs/reinvent4/bin/tensorboard",
              "--logdir", "${TB_LOGDIR:-/workspace/tb_TL}",
              "--host", "0.0.0.0", "--port", "6006"]
    volumes:
      - ${PWD}:/workspace:ro
    ports:
      - "6006:6006"
    restart: unless-stopped
