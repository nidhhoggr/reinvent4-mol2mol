x-reinvent-base: &reinvent-base
  build:
    context: .
  image: htvs-pipeline:latest
  working_dir: /workspace
  volumes:
    - .:/workspace
  environment:
    PYTHONUNBUFFERED: "1"
  restart: "no"
  stop_grace_period: 180s
  stop_signal: SIGTERM
  logging:
    driver: json-file
    options:
      max-size: "50m"
      max-file: "5"

services:
  tl:
    <<: *reinvent-base
    container_name: reinvent4-tl
    command: ["/opt/conda/envs/reinvent4/bin/reinvent",
              "-l", "tl.log", "configs/tl_mol2mol.toml"]

  sample:
    <<: *reinvent-base
    container_name: reinvent4-sample
    command: ["/opt/conda/envs/reinvent4/bin/reinvent",
              "-l", "sampling.log", "configs/sample_mol2mol.toml"]

  dock:
    <<: *reinvent-base
    container_name: reinvent4-dock
    # PATH A — virtual screen of results/sampled.csv against your receptor.
    # Placeholder: point this at your real docking command. Since your image
    # is htvs-pipeline, the engine is probably already inside (check with the
    # `which` command above). This script does: SMILES -> 3D -> dock -> scores.
    command: ["bash", "/workspace/scripts/dock.sh"]

  # PATH B (GPU/cluster only — heavy on CPU): closed-loop RL with docking.
  # rl:
  #   <<: *reinvent-base
  #   container_name: reinvent4-rl
  #   command: ["/opt/conda/envs/reinvent4/bin/reinvent",
  #             "-l", "rl.log", "configs/staged_learning.toml"]

  tensorboard:
    image: htvs-pipeline:latest
    container_name: reinvent-tb
    working_dir: /workspace
    command: ["/opt/conda/envs/reinvent4/bin/tensorboard",
              "--logdir", "/workspace/tb_TL",
              "--host", "0.0.0.0", "--port", "6006"]
    volumes:
      - ${PWD}:/workspace:ro
    ports:
      - "6006:6006"
    restart: unless-stopped
